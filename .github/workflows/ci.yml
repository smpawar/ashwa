name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install report dependencies
        run: pip install clickhouse-connect==1.10.0 python-dotenv==1.2.4
      - name: Python files compile
        run: python -m compileall -q -x '\.venv' .
      - name: Report CLI loads
        run: python ashwa_report.py --help > /dev/null
      - name: SQL sections share the same scope
        run: python scripts/check_sql_scope.py
