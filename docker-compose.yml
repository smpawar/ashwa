# Application database for the support agent (orders, refunds, knowledge base).
# Separate from Langfuse's own Postgres, which already uses port 5432.
services:
  appdb:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ashwa
      POSTGRES_PASSWORD: ashwa
      POSTGRES_DB: support
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all"]
    ports:
      - 127.0.0.1:5433:5432
    volumes:
      - appdb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashwa -d support"]
      interval: 3s
      retries: 20

volumes:
  appdb_data:
